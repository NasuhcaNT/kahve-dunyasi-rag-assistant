openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rag
    description: Kahve Dünyası source-grounded question answering
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rag/meta:
    get:
      operationId: getRagMeta
      tags: [rag]
      summary: Get RAG dataset metadata
      description: Returns the readiness and size of the source-grounded knowledge base
      responses:
        "200":
          description: Dataset metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagMetadata"
  /rag/suggestions:
    get:
      operationId: getRagSuggestions
      tags: [rag]
      summary: Get suggested questions
      description: Returns example questions supported by the knowledge base
      responses:
        "200":
          description: Suggested questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagSuggestions"
  /rag/ask:
    post:
      operationId: askRagQuestion
      tags: [rag]
      summary: Ask the source-grounded assistant
      description: Finds relevant knowledge-base passages and generates a cited answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagQuestionInput"
      responses:
        "200":
          description: Answer and cited sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagAnswer"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Knowledge base is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RagMetadata:
      type: object
      properties:
        isReady:
          type: boolean
        llmAvailable:
          type: boolean
        documentCount:
          type: integer
        chunkCount:
          type: integer
        sourceCount:
          type: integer
        model:
          type: string
        retrievalStrategy:
          type: string
      required: [isReady, llmAvailable, documentCount, chunkCount, sourceCount, model, retrievalStrategy]
    RagSuggestions:
      type: object
      properties:
        questions:
          type: array
          items:
            type: string
      required: [questions]
    RagChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required: [role, content]
    RagQuestionInput:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        history:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/RagChatMessage"
      required: [question]
    RagSource:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
        section:
          type: string
        excerpt:
          type: string
        score:
          type: number
      required: [id, title, url, section, excerpt, score]
    RagAnswer:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RagSource"
        retrievalCount:
          type: integer
        answerMode:
          type: string
          enum: [llm, extractive, no_match]
      required: [answer, sources, retrievalCount, answerMode]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
